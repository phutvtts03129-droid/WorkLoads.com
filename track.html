<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tra cứu đơn hàng - AURA</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{font-family:Inter,sans-serif}.serif{font-family:'Playfair Display',serif}</style></head><body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
<header class="bg-white/90 backdrop-blur sticky top-0 z-40 shadow-sm"><div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
<a href="index.html" class="serif text-2xl font-bold text-purple-700"><i class="fa-solid fa-gem mr-2"></i>AURA</a>
<nav class="hidden lg:flex text-sm font-medium"><a href="index.html" class="px-3 py-2 rounded-full hover:bg-purple-50 hover:text-purple-600">Trang chủ</a><a href="sale.html" class="px-3 py-2 rounded-full hover:bg-purple-50 hover:text-purple-600">Sale</a><a href="about.html" class="px-3 py-2 rounded-full hover:bg-purple-50 hover:text-purple-600">Về AURA</a><a href="stores.html" class="px-3 py-2 rounded-full hover:bg-purple-50 hover:text-purple-600">Cửa hàng</a><a href="blog.html" class="px-3 py-2 rounded-full hover:bg-purple-50 hover:text-purple-600">Tin tức</a><a href="faq.html" class="px-3 py-2 rounded-full hover:bg-purple-50 hover:text-purple-600">Hỗ trợ</a><a href="contact.html" class="px-3 py-2 rounded-full hover:bg-purple-50 hover:text-purple-600">Liên hệ</a></nav><div id="auth" class="text-sm"></div></div></header>
<section class="bg-gradient-to-br from-rose-100 via-purple-100 to-sky-100 py-14 text-center px-4"><i class="fa-solid fa-box text-purple-500 text-3xl"></i><h1 class="serif text-4xl font-bold mt-3">Tra cứu đơn hàng</h1><p class="text-slate-500 mt-2">Nhập mã đơn để xem trạng thái</p></section>
<main class="max-w-5xl mx-auto px-4 py-10 w-full flex-1"><div class="bg-white rounded-2xl p-6 shadow-sm"><div class="flex gap-2"><input id="q" class="flex-1 border rounded-xl px-4 py-2.5" placeholder="Mã đơn, ví dụ AU1001"><button onclick="find()" class="px-6 rounded-xl bg-purple-600 text-white font-bold">Tra cứu</button></div><div id="r" class="mt-4 text-sm"></div><a href="customer.html#orders" class="text-purple-600 underline text-sm">Xem tất cả đơn của tôi</a></div></main>
<footer class="bg-slate-900 text-slate-400 text-sm"><div class="max-w-6xl mx-auto px-4 py-8 flex flex-wrap gap-x-6 gap-y-2 justify-center"><a href="shipping.html" class="hover:text-white">Giao hàng & đổi trả</a><a href="size-guide.html" class="hover:text-white">Chọn size</a><a href="track.html" class="hover:text-white">Tra cứu đơn</a><a href="privacy.html" class="hover:text-white">Bảo mật & điều khoản</a><a href="faq.html" class="hover:text-white">Câu hỏi thường gặp</a><a href="login.html" class="hover:text-white">Đăng nhập</a></div><p class="text-center pb-6 text-xs">© 2026 AURA. Hotline 1900 8888</p></footer>
<script>let ME=null;try{ME=JSON.parse(localStorage.getItem('aura_user'))}catch(e){}
document.getElementById('auth').innerHTML=ME?`<a href="${ME.role==='admin'?'admin.html':'customer.html'}" class="font-semibold hover:text-purple-600"><i class="fa-solid fa-user mr-1"></i>${ME.name}</a>`:'<a href="login.html" class="px-4 py-2 rounded-full bg-purple-600 text-white font-bold">Đăng nhập</a>';
function find(){let o=[];try{o=JSON.parse(localStorage.getItem('aura_orders')||'[]')}catch(e){}const k=q.value.trim().toLowerCase(),x=o.find(i=>String(i.id).toLowerCase()===k);r.innerHTML=x?`<p class='text-green-600'>Tìm thấy đơn <b>${x.id}</b> — trạng thái: <b>${x.status||'Đang xử lý'}</b></p>`:'<p class="text-red-500">Không tìm thấy đơn hàng.</p>'}</script></body></html>
