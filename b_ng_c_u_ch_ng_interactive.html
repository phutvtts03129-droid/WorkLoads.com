<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Cửu Chương Interactive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    animation: {
                        'bounce-short': 'bounce 0.5s ease-in-out 1',
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .tab-active {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* Color variations for table cards */
        .theme-1 { border-top-color: #ef4444; background-gradient: linear-gradient(135deg, #fef2f2, #ffffff); }
        .theme-2 { border-top-color: #f97316; background-gradient: linear-gradient(135deg, #fff7ed, #ffffff); }
        .theme-3 { border-top-color: #f59e0b; background-gradient: linear-gradient(135deg, #fffbeb, #ffffff); }
        .theme-4 { border-top-color: #84cc16; background-gradient: linear-gradient(135deg, #f7fee7, #ffffff); }
        .theme-5 { border-top-color: #10b981; background-gradient: linear-gradient(135deg, #ecfdf5, #ffffff); }
        .theme-6 { border-top-color: #06b6d4; background-gradient: linear-gradient(135deg, #ecfeff, #ffffff); }
        .theme-7 { border-top-color: #3b82f6; background-gradient: linear-gradient(135deg, #eff6ff, #ffffff); }
        .theme-8 { border-top-color: #6366f1; background-gradient: linear-gradient(135deg, #eef2ff, #ffffff); }
        .theme-9 { border-top-color: #8b5cf6; background-gradient: linear-gradient(135deg, #f5f3ff, #ffffff); }
        .theme-10 { border-top-color: #ec4899; background-gradient: linear-gradient(135deg, #fdf2f8, #ffffff); }

        .btn-filter-1 { background-color: #ef4444; }
        .btn-filter-2 { background-color: #f97316; }
        .btn-filter-3 { background-color: #f59e0b; }
        .btn-filter-4 { background-color: #84cc16; }
        .btn-filter-5 { background-color: #10b981; }
        .btn-filter-6 { background-color: #06b6d4; }
        .btn-filter-7 { background-color: #3b82f6; }
        .btn-filter-8 { background-color: #6366f1; }
        .btn-filter-9 { background-color: #8b5cf6; }
        .btn-filter-10 { background-color: #ec4899; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <header class="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="p-2.5 bg-white/10 rounded-2xl backdrop-blur-md">
                    <i class="fa-solid fa-calculator text-2xl text-yellow-300"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight">Bảng Cửu Chương</h1>
                    <p class="text-xs text-indigo-100">Học tập thông minh - Hiệu quả mỗi ngày</p>
                </div>
            </div>

            <!-- Mode Switcher Tabs -->
            <div class="flex bg-black/20 p-1 rounded-xl backdrop-blur-md border border-white/10">
                <button id="nav-learn" onclick="switchMode('learn')" class="flex items-center space-x-2 px-5 py-2 rounded-lg text-sm font-semibold transition-all duration-200 bg-white text-indigo-700 shadow-md">
                    <i class="fa-solid fa-book-open"></i>
                    <span>Học Tập</span>
                </button>
                <button id="nav-practice" onclick="switchMode('practice')" class="flex items-center space-x-2 px-5 py-2 rounded-lg text-sm font-semibold transition-all duration-200 text-white hover:bg-white/10">
                    <i class="fa-solid fa-gamepad"></i>
                    <span>Luyện Tập</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 sm:px-6 lg:px-8">

        <!-- ================= LEARN MODE ================= -->
        <div id="mode-learn" class="space-y-6">
            
            <!-- Quick Filter Bar -->
            <div class="glass-card p-4 rounded-2xl shadow-sm space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-2">
                        <i class="fa-solid fa-filter text-indigo-500"></i> Chọn bảng cửu chương:
                    </span>
                    <button onclick="filterTables('all')" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 transition">
                        Hiện tất cả (1-10)
                    </button>
                </div>
                
                <div class="flex flex-wrap gap-2 justify-center sm:justify-start">
                    <button onclick="filterTables('all')" id="btn-all" class="filter-btn active px-4 py-2 rounded-xl text-xs font-bold transition-all transform active:scale-95 bg-indigo-600 text-white shadow-md">
                        Tất cả
                    </button>
                    <!-- Buttons 1 to 10 generated dynamically or hardcoded -->
                    <script>
                        for(let i = 1; i <= 10; i++) {
                            document.write(`
                                <button onclick="filterTables(${i})" id="btn-${i}" class="filter-btn px-3.5 py-2 rounded-xl text-xs font-bold transition-all transform hover:-translate-y-0.5 active:scale-95 bg-white text-slate-700 hover:bg-slate-50 shadow-sm border border-slate-200">
                                    Bảng ${i}
                                </button>
                            `);
                        }
                    </script>
                </div>
            </div>

            <!-- Multiplications Grid -->
            <div id="tables-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-5">
                <!-- Javascript will populate the tables here -->
            </div>
        </div>

        <!-- ================= PRACTICE MODE ================= -->
        <div id="mode-practice" class="hidden max-w-2xl mx-auto space-y-6">
            
            <!-- Practice Settings Card -->
            <div class="glass-card p-6 rounded-3xl shadow-lg border border-indigo-50 text-center space-y-6 relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl"></div>
                <div class="absolute -left-10 -bottom-10 w-32 h-32 bg-pink-500/10 rounded-full blur-2xl"></div>

                <!-- Stats Bar -->
                <div class="grid grid-cols-3 gap-3 bg-slate-50 p-3 rounded-2xl border border-slate-100">
                    <div>
                        <p class="text-xs text-slate-500 font-medium">Đúng</p>
                        <p id="score-correct" class="text-xl font-black text-emerald-500">0</p>
                    </div>
                    <div>
                        <p class="text-xs text-slate-500 font-medium">Sai</p>
                        <p id="score-wrong" class="text-xl font-black text-rose-500">0</p>
                    </div>
                    <div>
                        <p class="text-xs text-slate-500 font-medium">Chuỗi Đúng</p>
                        <p id="score-streak" class="text-xl font-black text-amber-500">0 🔥</p>
                    </div>
                </div>

                <!-- Practice Table Filter Selection -->
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-500 block">Phạm vi câu hỏi:</label>
                    <select id="practice-range" onchange="generateQuestion()" class="w-full max-w-xs px-4 py-2.5 rounded-xl border border-slate-200 bg-white font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
                        <option value="all">Tất cả bảng cửu chương (1-10)</option>
                        <option value="1">Bảng cửu chương 1</option>
                        <option value="2">Bảng cửu chương 2</option>
                        <option value="3">Bảng cửu chương 3</option>
                        <option value="4">Bảng cửu chương 4</option>
                        <option value="5">Bảng cửu chương 5</option>
                        <option value="6">Bảng cửu chương 6</option>
                        <option value="7">Bảng cửu chương 7</option>
                        <option value="8">Bảng cửu chương 8</option>
                        <option value="9">Bảng cửu chương 9</option>
                        <option value="10">Bảng cửu chương 10</option>
                    </select>
                </div>

                <!-- Main Quiz Card -->
                <div class="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-3xl p-8 text-white shadow-xl space-y-6 relative">
                    <div class="inline-block px-3 py-1 bg-white/20 rounded-full text-xs font-semibold backdrop-blur-md">
                        Thử thách tính nhẩm
                    </div>
                    
                    <div class="text-5xl sm:text-6xl font-extrabold tracking-wider flex justify-center items-center gap-3">
                        <span id="quiz-num1">?</span>
                        <span class="text-pink-300">×</span>
                        <span id="quiz-num2">?</span>
                        <span>=</span>
                        <span class="text-yellow-300">?</span>
                    </div>

                    <!-- Input Box -->
                    <form onsubmit="checkAnswer(event)" class="space-y-4 max-w-xs mx-auto">
                        <input type="number" id="quiz-answer" placeholder="Nhập đáp án..." autofocus required
                            class="w-full text-center text-2xl font-bold py-3 px-4 rounded-2xl border-2 border-white/30 bg-white/10 text-white placeholder-white/50 focus:outline-none focus:bg-white focus:text-slate-800 transition-all duration-200 shadow-inner">
                        
                        <button type="submit" class="w-full py-3.5 px-6 rounded-2xl bg-yellow-400 hover:bg-yellow-300 text-slate-900 font-extrabold shadow-lg hover:shadow-xl transition transform active:scale-95 flex justify-center items-center gap-2">
                            <span>Trả lời</span>
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </form>

                    <!-- Feedback Alert -->
                    <div id="quiz-feedback" class="min-h-[2.5rem] flex items-center justify-center font-bold text-lg"></div>
                </div>

                <!-- Action Controls -->
                <div class="flex justify-center gap-4">
                    <button onclick="resetStats()" class="text-xs text-slate-400 hover:text-slate-600 font-semibold flex items-center gap-1 transition">
                        <i class="fa-solid fa-rotate-left"></i> Đặt lại điểm số
                    </button>
                </div>
            </div>
        </div>

    </main>

    <footer class="bg-white border-t border-slate-200 py-4 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 font-medium">
            Bảng cửu chương dành cho học sinh &bull; Lập trình với HTML, CSS & JavaScript
        </div>
    </footer>

    <script>
        // Array of themes for 10 tables
        const themes = [
            { border: 'border-red-500', bg: 'bg-red-500/10', text: 'text-red-600', badge: 'bg-red-500' },
            { border: 'border-orange-500', bg: 'bg-orange-500/10', text: 'text-orange-600', badge: 'bg-orange-500' },
            { border: 'border-amber-500', bg: 'bg-amber-500/10', text: 'text-amber-600', badge: 'bg-amber-500' },
            { border: 'border-lime-500', bg: 'bg-lime-500/10', text: 'text-lime-600', badge: 'bg-lime-500' },
            { border: 'border-emerald-500', bg: 'bg-emerald-500/10', text: 'text-emerald-600', badge: 'bg-emerald-500' },
            { border: 'border-cyan-500', bg: 'bg-cyan-500/10', text: 'text-cyan-600', badge: 'bg-cyan-500' },
            { border: 'border-blue-500', bg: 'bg-blue-500/10', text: 'text-blue-600', badge: 'bg-blue-500' },
            { border: 'border-indigo-500', bg: 'bg-indigo-500/10', text: 'text-indigo-600', badge: 'bg-indigo-500' },
            { border: 'border-purple-500', bg: 'bg-purple-500/10', text: 'text-purple-600', badge: 'bg-purple-500' },
            { border: 'border-pink-500', bg: 'bg-pink-500/10', text: 'text-pink-600', badge: 'bg-pink-500' }
        ];

        // State variables
        let currentMode = 'learn';
        let correctAnswers = 0;
        let wrongAnswers = 0;
        let streak = 0;
        let num1 = 1;
        let num2 = 1;

        // Initialize Learning Grid
        function renderTables() {
            const container = document.getElementById('tables-grid');
            container.innerHTML = '';

            for (let i = 1; i <= 10; i++) {
                const theme = themes[i - 1];
                let rowsHTML = '';

                for (let j = 1; j <= 10; j++) {
                    rowsHTML += `
                        <div class="flex justify-between items-center py-1.5 px-3 rounded-lg hover:bg-slate-100/80 transition-colors text-xs sm:text-sm font-semibold">
                            <span class="text-slate-600">${i} × ${j}</span>
                            <span class="text-slate-400 font-normal">=</span>
                            <span class="${theme.text} font-bold">${i * j}</span>
                        </div>
                    `;
                }

                const cardHTML = `
                    <div id="table-card-${i}" class="table-card bg-white rounded-2xl shadow-sm hover:shadow-md border-t-4 ${theme.border} border-x border-b border-slate-200 p-4 transition-all duration-300 transform hover:-translate-y-1">
                        <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-2">
                            <div class="flex items-center gap-2">
                                <span class="${theme.badge} text-white w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs shadow-sm">
                                    ${i}
                                </span>
                                <h3 class="font-bold text-slate-800 text-sm">Bảng số ${i}</h3>
                            </div>
                            <button onclick="practiceSpecificTable(${i})" title="Luyện tập bảng này" class="text-xs text-slate-400 hover:text-indigo-600 p-1 rounded-md transition">
                                <i class="fa-solid fa-play"></i>
                            </button>
                        </div>
                        <div class="space-y-0.5">
                            ${rowsHTML}
                        </div>
                    </div>
                `;

                container.insertAdjacentHTML('beforeend', cardHTML);
            }
        }

        // Filter Function for Tables
        function filterTables(tableNum) {
            // Update filter buttons styling
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                btn.className = "filter-btn px-3.5 py-2 rounded-xl text-xs font-bold transition-all transform hover:-translate-y-0.5 active:scale-95 bg-white text-slate-700 hover:bg-slate-50 shadow-sm border border-slate-200";
            });

            if (tableNum === 'all') {
                const allBtn = document.getElementById('btn-all');
                allBtn.className = "filter-btn active px-4 py-2 rounded-xl text-xs font-bold transition-all transform active:scale-95 bg-indigo-600 text-white shadow-md";
            } else {
                const activeBtn = document.getElementById(`btn-${tableNum}`);
                activeBtn.className = `filter-btn active px-4 py-2 rounded-xl text-xs font-bold transition-all transform active:scale-95 text-white shadow-md btn-filter-${tableNum}`;
            }

            // Show/hide table cards
            for (let i = 1; i <= 10; i++) {
                const card = document.getElementById(`table-card-${i}`);
                if (tableNum === 'all' || tableNum === i) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            }
        }

        // Switch Between Learn and Practice Mode
        function switchMode(mode) {
            currentMode = mode;
            const learnView = document.getElementById('mode-learn');
            const practiceView = document.getElementById('mode-practice');
            const navLearn = document.getElementById('nav-learn');
            const navPractice = document.getElementById('nav-practice');

            if (mode === 'learn') {
                learnView.classList.remove('hidden');
                practiceView.classList.add('hidden');

                navLearn.className = "flex items-center space-x-2 px-5 py-2 rounded-lg text-sm font-semibold transition-all duration-200 bg-white text-indigo-700 shadow-md";
                navPractice.className = "flex items-center space-x-2 px-5 py-2 rounded-lg text-sm font-semibold transition-all duration-200 text-white hover:bg-white/10";
            } else {
                learnView.classList.add('hidden');
                practiceView.classList.remove('hidden');

                navPractice.className = "flex items-center space-x-2 px-5 py-2 rounded-lg text-sm font-semibold transition-all duration-200 bg-white text-indigo-700 shadow-md";
                navLearn.className = "flex items-center space-x-2 px-5 py-2 rounded-lg text-sm font-semibold transition-all duration-200 text-white hover:bg-white/10";

                generateQuestion();
            }
        }

        // Practice specific table directly
        function practiceSpecificTable(num) {
            document.getElementById('practice-range').value = num;
            switchMode('practice');
        }

        // Generate Quiz Question
        function generateQuestion() {
            const range = document.getElementById('practice-range').value;
            
            if (range === 'all') {
                num1 = Math.floor(Math.random() * 10) + 1;
            } else {
                num1 = parseInt(range);
            }
            
            num2 = Math.floor(Math.random() * 10) + 1;

            document.getElementById('quiz-num1').innerText = num1;
            document.getElementById('quiz-num2').innerText = num2;
            
            const input = document.getElementById('quiz-answer');
            input.value = '';
            input.focus();
            
            document.getElementById('quiz-feedback').innerHTML = '';
        }

        // Check Practice Answer
        function checkAnswer(event) {
            event.preventDefault();
            const input = document.getElementById('quiz-answer');
            const feedback = document.getElementById('quiz-feedback');
            const userAnswer = parseInt(input.value);
            const correctAnswer = num1 * num2;

            if (userAnswer === correctAnswer) {
                correctAnswers++;
                streak++;
                feedback.innerHTML = `<span class="text-emerald-300 animate-bounce-short flex items-center gap-2"><i class="fa-solid fa-circle-check"></i> Chính xác! Xuất sắc!</span>`;
                
                // Update stats
                document.getElementById('score-correct').innerText = correctAnswers;
                document.getElementById('score-streak').innerText = `${streak} 🔥`;

                setTimeout(() => {
                    generateQuestion();
                }, 1000);
            } else {
                wrongAnswers++;
                streak = 0;
                feedback.innerHTML = `<span class="text-yellow-200 flex items-center gap-2"><i class="fa-solid fa-circle-xmark"></i> Chưa đúng! Đáp án đúng là ${correctAnswer}</span>`;
                
                // Update stats
                document.getElementById('score-wrong').innerText = wrongAnswers;
                document.getElementById('score-streak').innerText = `0 🔥`;

                input.select();
            }
        }

        // Reset Practice Statistics
        function resetStats() {
            correctAnswers = 0;
            wrongAnswers = 0;
            streak = 0;
            document.getElementById('score-correct').innerText = '0';
            document.getElementById('score-wrong').innerText = '0';
            document.getElementById('score-streak').innerText = '0 🔥';
            generateQuestion();
        }

        // Window Load Initialization
        window.onload = function() {
            renderTables();
        };
    </script>
</body>
</html>
