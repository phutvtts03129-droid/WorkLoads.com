<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tài khoản của tôi - AURA</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{font-family:Inter,sans-serif}.serif{font-family:'Playfair Display',serif}
@keyframes up{from{opacity:0;transform:translateY(14px)}}.up{animation:up .5s both}@keyframes fl{50%{transform:translateY(-12px)}}.fl{animation:fl 5s ease-in-out infinite}
.inp{width:100%;padding:.65rem .9rem;border:1px solid #e2e8f0;border-radius:.75rem;outline:none;background:#fff}.inp:focus{border-color:#a855f7;box-shadow:0 0 0 3px #f3e8ff}
.ticket{-webkit-mask:radial-gradient(circle 10px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 10px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}</style></head>
<body class="bg-gradient-to-br from-rose-50 via-violet-50 to-sky-50 min-h-screen">
<i class="fa-solid fa-gem fl fixed top-24 right-10 text-purple-200 text-5xl -z-0"></i><i class="fa-solid fa-heart fl fixed bottom-10 left-10 text-pink-200 text-4xl"></i>
<header class="bg-white/80 backdrop-blur sticky top-0 z-30 border-b border-slate-200/70"><div class="max-w-6xl mx-auto px-4 h-16 flex items-center gap-3">
 <a href="index.html" class="serif text-2xl font-bold flex items-center gap-2"><span class="w-9 h-9 rounded-full bg-gradient-to-tr from-slate-900 to-purple-800 text-amber-400 flex items-center justify-center">A</span>AURA<span class="text-amber-500">.</span></a>
 <span class="flex-1"></span><a href="index.html#products" class="px-4 py-2 rounded-full bg-slate-900 text-white text-sm font-semibold hover:bg-purple-700 transition"><i class="fa-solid fa-bag-shopping mr-1"></i>Tiếp tục mua sắm</a>
 <button onclick="localStorage.removeItem('aura_user');location.href='login.html'" class="w-9 h-9 rounded-full hover:bg-red-50 text-slate-500 hover:text-red-500" title="Đăng xuất"><i class="fa-solid fa-right-from-bracket"></i></button></div></header>
<div class="max-w-6xl mx-auto px-4 py-6 grid md:grid-cols-4 gap-6 relative">
 <aside class="md:col-span-1"><div class="bg-white rounded-3xl shadow-sm p-5 text-center up"><div id="sav" class="mx-auto w-20 h-20"></div><b id="sname" class="block mt-3 text-lg"></b><span id="stier" class="inline-block mt-1 px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-700"></span></div>
 <nav id="side" class="bg-white rounded-3xl shadow-sm p-2 mt-4 flex md:block overflow-x-auto up"></nav></aside>
 <main class="md:col-span-3 min-w-0" id="view"></main></div>
<div id="modal" class="hidden fixed inset-0 z-50 bg-indigo-950/50 backdrop-blur-sm flex items-center justify-center p-4"><div id="mbox" class="bg-white rounded-3xl w-full max-w-md p-6 up"></div></div>
<div id="toast" class="hidden fixed bottom-6 right-6 z-[60] bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl text-sm"></div>
<script>
let ME=null;try{ME=JSON.parse(localStorage.getItem('aura_user'))}catch(e){}
if(!ME)location.href='login.html';
const L=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Bộ nhớ đầy!')}};
const money=n=>Number(n||0).toLocaleString('vi-VN')+'đ',esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),2200)}
const U=i=>`https://images.unsplash.com/photo-${i}?q=80&w=300&auto=format&fit=crop`;
// ---- dữ liệu ----
let C=L('aura_cus_v1',null);
if(!C){C={p:{name:ME.name,email:ME.user+'@mail.com',phone:'0901 234 567',dob:'1998-05-20',gender:'Nữ',avatar:'',points:1200},
 addr:[{id:1,name:ME.name,phone:'0901 234 567',line:'12 Nguyễn Huệ, Quận 1, TP.HCM',def:1},{id:2,name:ME.name,phone:'0901 234 567',line:'Landmark 81, Bình Thạnh, TP.HCM',def:0}],
 vc:[{code:'AURA2026',v:'Giảm 200.000đ',d:'Đơn từ 1.000.000đ',exp:'09/10/2026',ok:1},{code:'FREESHIP',v:'Miễn phí vận chuyển',d:'Mọi đơn hàng',exp:'31/10/2026',ok:1},{code:'BIRTHDAY',v:'Giảm 15%',d:'Quà sinh nhật',exp:'20/05/2026',ok:0}]};S('aura_cus_v1',C)}
if(!localStorage.getItem('aura_orders_seeded')){const o=L('aura_orders',[]);S('aura_orders',[...o,{code:'#1001',date:'2026-10-01',status:'Đang giao',total:2800000,items:[{name:'Áo Blazer Dáng Rộng Luxe',price:1850000,quantity:1,image:U('1584273143981-41c073dfe8f8')},{name:'Kính Mát Aviator Gold',price:690000,quantity:1,image:U('1572635196237-14b3f281503f')}]},{code:'#0988',date:'2026-09-20',status:'Hoàn tất',total:950000,items:[{name:'Áo Sơ Mi Nam Cotton Ý',price:950000,quantity:1,image:U('1556905055-8f358a7a47b2')}]},{code:'#0950',date:'2026-09-02',status:'Hoàn tất',total:3450000,items:[{name:'Đồng Hồ Automatic Signature',price:3450000,quantity:1,image:U('1523275335684-37898b6baf30')}]}]);localStorage.setItem('aura_orders_seeded',1)}
if(localStorage.getItem('aura_fav')===null)S('aura_fav',[{id:7,name:'Đầm Dạ Hội Satin',price:2100000,image:U('1515886657613-9f3515b0c78f'),cat:'Thời Trang Nữ'},{id:105,name:'Giày Sneaker Street Pro',price:1450000,image:U('1542291026-7eec264c27ff'),cat:'Thời Trang Nam'}]);
const TIERS=[['Thường',0],['Bạc',500],['Vàng',1500],['Kim cương',3000]];
const tier=()=>{let t=0;TIERS.forEach((x,i)=>{if(C.p.points>=x[1])t=i});return t};
const COL=['bg-emerald-100 text-emerald-700','bg-amber-100 text-amber-700','bg-sky-100 text-sky-700','bg-rose-100 text-rose-700'];
const ST=['Chờ xác nhận','Đang giao','Hoàn tất','Đã hủy'];
const TABS=[['profile','fa-user','Hồ sơ của tôi'],['orders','fa-receipt','Đơn hàng của tôi'],['fav','fa-heart','Yêu thích'],['address','fa-location-dot','Sổ địa chỉ'],['voucher','fa-ticket','Voucher của tôi'],['chat','fa-headset','Hỗ trợ / Chat']];
let cur='profile',ofl='';
const avatar=(c='w-20 h-20')=>C.p.avatar?`<img src="${C.p.avatar}" class="${c} rounded-full object-cover mx-auto ring-4 ring-purple-100">`:`<span class="${c} rounded-full bg-gradient-to-br from-purple-500 to-indigo-600 text-white text-3xl font-bold flex items-center justify-center mx-auto ring-4 ring-purple-100">${esc(C.p.name[0]||'A')}</span>`;
function shell(){sav.innerHTML=avatar();sname.textContent=C.p.name;stier.innerHTML='<i class="fa-solid fa-crown mr-1"></i>Hạng '+TIERS[tier()][0];
 const cnt={orders:L('aura_orders',[]).length,fav:L('aura_fav',[]).length,address:C.addr.length,voucher:C.vc.filter(v=>v.ok).length};
 side.innerHTML=TABS.map(t=>`<a href="#${t[0]}" class="flex items-center whitespace-nowrap gap-1 p-3 rounded-2xl text-sm transition ${t[0]===cur?'bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-semibold shadow':'hover:bg-purple-50 text-slate-600'}"><i class="fa-solid ${t[1]} w-6"></i>${t[2]}${cnt[t[0]]!=null?`<span class="ml-auto text-[10px] px-2 rounded-full ${t[0]===cur?'bg-white/25':'bg-slate-100'}">${cnt[t[0]]}</span>`:''}</a>`).join('')}
const H=(i,t,x='')=>`<div class="flex items-center gap-3 mb-5 up"><h1 class="text-2xl font-bold flex-1"><i class="fa-solid ${i} text-purple-500 mr-2"></i>${t}</h1>${x}</div>`;
const views={
profile(){const t=tier(),nx=TIERS[t+1],pc=nx?Math.min(100,(C.p.points-TIERS[t][1])/(nx[1]-TIERS[t][1])*100):100,o=L('aura_orders',[]);
 return H('fa-user','Hồ sơ của tôi')+`<div class="rounded-3xl p-6 bg-gradient-to-br from-purple-600 via-indigo-600 to-sky-500 text-white shadow-xl up relative overflow-hidden"><i class="fa-solid fa-gem absolute -right-4 -bottom-4 text-8xl text-white/10"></i><div class="flex items-center justify-between"><div><div class="text-sm text-white/70">Điểm thành viên</div><div class="serif text-4xl font-bold">${C.p.points.toLocaleString('vi-VN')}</div></div><span class="px-4 py-1.5 rounded-full bg-amber-400 text-slate-900 font-bold text-sm"><i class="fa-solid fa-crown mr-1"></i>${TIERS[t][0]}</span></div><div class="h-2.5 bg-white/25 rounded-full mt-4"><div class="h-full bg-amber-300 rounded-full" style="width:${pc}%"></div></div><div class="text-xs text-white/80 mt-2">${nx?`Còn ${nx[1]-C.p.points} điểm để lên hạng ${nx[0]}`:'Bạn đã đạt hạng cao nhất 🎉'}</div></div>
 <div class="grid grid-cols-3 gap-3 mt-4 up">${[['fa-bag-shopping','Đơn hàng',o.length],['fa-heart','Yêu thích',L('aura_fav',[]).length],['fa-sack-dollar','Đã chi',money(o.filter(x=>x.status==='Hoàn tất').reduce((a,x)=>a+x.total,0))]].map(x=>`<div class="bg-white rounded-2xl p-4 shadow-sm text-center"><i class="fa-solid ${x[0]} text-purple-500"></i><div class="font-bold mt-1 text-sm md:text-base truncate">${x[2]}</div><div class="text-xs text-slate-400">${x[1]}</div></div>`).join('')}</div>
 <div class="bg-white rounded-3xl shadow-sm p-6 mt-4 up"><div class="flex items-center gap-4 mb-4">${avatar('w-16 h-16')}<label class="px-4 py-2 rounded-xl border text-sm font-semibold cursor-pointer hover:bg-purple-50"><i class="fa-solid fa-camera mr-1"></i>Đổi ảnh<input type="file" accept="image/*" hidden onchange="pickAv(this)"></label></div>
 <div class="grid sm:grid-cols-2 gap-4">${[['name','Họ tên','text'],['email','Email','email'],['phone','Số điện thoại','text'],['dob','Ngày sinh','date']].map(f=>`<label><span class="text-sm text-slate-500">${f[1]}</span><input id="f_${f[0]}" type="${f[2]}" value="${esc(C.p[f[0]])}" class="inp mt-1"></label>`).join('')}<label><span class="text-sm text-slate-500">Giới tính</span><select id="f_gender" class="inp mt-1">${['Nữ','Nam','Khác'].map(g=>`<option ${C.p.gender===g?'selected':''}>${g}</option>`).join('')}</select></label></div>
 <button onclick="saveP()" class="mt-5 px-7 py-3 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold hover:shadow-lg"><i class="fa-solid fa-floppy-disk mr-2"></i>Lưu thay đổi</button></div>`},
orders(){const all=L('aura_orders',[]),l=all.filter(o=>!ofl||o.status===ofl);
 return H('fa-receipt','Đơn hàng của tôi')+`<div class="flex gap-2 overflow-x-auto mb-4 up">${['',...ST].map(s=>`<button onclick="ofl='${s}';render()" class="px-4 py-2 rounded-full text-sm whitespace-nowrap ${s===ofl?'bg-slate-900 text-white':'bg-white hover:bg-purple-50'} shadow-sm">${s||'Tất cả'}</button>`).join('')}</div>`+
 (l.map((o,i)=>{const si=Math.max(0,['Chờ xác nhận','Đang giao','Hoàn tất'].indexOf(o.status)),x=ST.indexOf(o.status);return `<div class="bg-white rounded-3xl shadow-sm p-5 mb-4 up hover:shadow-lg transition" style="animation-delay:${i*60}ms"><div class="flex flex-wrap items-center gap-2"><b>Đơn ${esc(o.code)}</b><span class="text-xs text-slate-400"><i class="fa-regular fa-calendar mr-1"></i>${o.date}</span><span class="ml-auto px-3 py-1 rounded-full text-xs font-semibold ${COL[x]}">${o.status}</span></div>
 ${o.status!=='Đã hủy'?`<div class="flex items-center mt-4 text-[11px] text-slate-400">${['Đặt hàng','Đang giao','Hoàn tất'].map((t,j)=>`<div class="flex-1 text-center relative"><span class="w-7 h-7 rounded-full mx-auto flex items-center justify-center ${j<=si?'bg-emerald-500 text-white':'bg-slate-100'}"><i class="fa-solid ${j<=si?'fa-check':'fa-circle'} text-[10px]"></i></span>${t}</div>`).join('<div class="flex-1 h-0.5 bg-slate-200 -mt-4"></div>')}</div>`:''}
 <div class="flex gap-2 mt-4">${o.items.map(it=>`<img src="${esc(it.image)}" title="${esc(it.name)} x${it.quantity}" class="w-14 h-14 rounded-xl object-cover bg-slate-100" onerror="this.style.opacity=.2">`).join('')}</div>
 <div id="d${i}" class="hidden mt-3 text-sm text-slate-600 space-y-1">${o.items.map(it=>`<div class="flex justify-between"><span>${esc(it.name)} × ${it.quantity}</span><span>${money(it.price*it.quantity)}</span></div>`).join('')}</div>
 <div class="flex items-center mt-4"><span class="text-slate-500 text-sm">Tổng:&nbsp;<b class="text-purple-700 text-lg">${money(o.total)}</b></span><span class="flex-1"></span><button onclick="document.getElementById('d${i}').classList.toggle('hidden')" class="px-4 py-2 rounded-xl border text-sm font-semibold hover:bg-purple-50">Chi tiết</button>${o.status==='Chờ xác nhận'?`<button onclick="cancel('${o.code}')" class="ml-2 px-4 py-2 rounded-xl bg-red-50 text-red-500 text-sm font-semibold hover:bg-red-100">Hủy đơn</button>`:''}</div></div>`}).join('')||empty('fa-box-open','Chưa có đơn hàng nào'))},
fav(){const l=L('aura_fav',[]);return H('fa-heart','Sản phẩm yêu thích')+(l.length?`<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">${l.map((p,i)=>`<div class="group bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-xl hover:-translate-y-2 transition up" style="animation-delay:${i*60}ms"><div class="relative aspect-[4/5] overflow-hidden bg-slate-100"><img src="${esc(p.image)}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500" onerror="this.style.opacity=.2"><button onclick="unfav(${p.id})" class="absolute top-3 right-3 w-9 h-9 rounded-full bg-white shadow text-rose-500 hover:scale-110 transition"><i class="fa-solid fa-heart"></i></button></div><div class="p-4"><span class="text-[11px] font-bold text-slate-400 uppercase">${esc(p.cat)}</span><div class="font-semibold">${esc(p.name)}</div><div class="flex items-center mt-2"><b class="text-purple-700 flex-1">${money(p.price)}</b><a href="index.html#products" class="px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-bold hover:bg-purple-700"><i class="fa-solid fa-bag-shopping mr-1"></i>Mua ngay</a></div></div></div>`).join('')}</div>`:empty('fa-heart','Chưa có sản phẩm yêu thích','Bấm ❤ trên sản phẩm ở trang chủ để lưu lại.'))},
address(){return H('fa-location-dot','Sổ địa chỉ',`<button onclick="addrForm()" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-semibold"><i class="fa-solid fa-plus mr-1"></i>Thêm địa chỉ</button>`)+(C.addr.map((a,i)=>`<div class="bg-white rounded-3xl shadow-sm p-5 mb-4 flex gap-4 items-start up hover:shadow-lg transition" style="animation-delay:${i*60}ms"><span class="w-11 h-11 rounded-2xl bg-purple-100 text-purple-600 flex items-center justify-center shrink-0"><i class="fa-solid fa-house"></i></span><div class="flex-1 min-w-0"><b>${esc(a.name)}</b> <span class="text-slate-400 text-sm">• ${esc(a.phone)}</span>${a.def?'<span class="ml-2 px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 text-[10px] font-bold">MẶC ĐỊNH</span>':''}<div class="text-sm text-slate-500 mt-1">${esc(a.line)}</div><div class="mt-3 text-sm">${a.def?'':`<button onclick="defA(${a.id})" class="text-purple-600 font-semibold mr-4">Đặt mặc định</button>`}<button onclick="addrForm(${a.id})" class="text-sky-600 font-semibold mr-4">Sửa</button><button onclick="delA(${a.id})" class="text-red-500 font-semibold">Xóa</button></div></div></div>`).join('')||empty('fa-location-dot','Chưa có địa chỉ nào'))},
voucher(){return H('fa-ticket','Voucher của tôi')+`<div class="grid sm:grid-cols-2 gap-4">${C.vc.map((v,i)=>`<div class="ticket flex bg-white shadow-sm up ${v.ok?'':'opacity-50'}" style="animation-delay:${i*60}ms"><div class="w-24 bg-gradient-to-b ${v.ok?'from-amber-400 to-orange-500':'from-slate-300 to-slate-400'} text-white flex flex-col items-center justify-center"><i class="fa-solid fa-ticket text-2xl"></i><span class="text-[10px] font-bold mt-1">${v.ok?'CÒN HẠN':'HẾT HẠN'}</span></div><div class="flex-1 p-4 border-l-2 border-dashed border-slate-200"><b>${esc(v.v)}</b><div class="text-xs text-slate-400">${esc(v.d)} • HSD ${v.exp}</div><div class="flex items-center gap-2 mt-3"><code class="px-3 py-1 rounded-lg bg-purple-50 text-purple-700 font-bold tracking-wider">${v.code}</code>${v.ok?`<button onclick="navigator.clipboard&&navigator.clipboard.writeText('${v.code}');toast('Đã sao chép ${v.code}')" class="text-xs font-semibold text-slate-500 hover:text-purple-600"><i class="fa-regular fa-copy mr-1"></i>Sao chép</button>`:''}</div></div></div>`).join('')}</div>`},
chat(){const m=L('aura_chat',[{me:0,t:'Xin chào! AURA có thể giúp gì cho bạn? 😊'}]);
 return H('fa-headset','Hỗ trợ / Chat')+`<div class="bg-white rounded-3xl shadow-sm overflow-hidden up"><div class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white p-4 flex items-center gap-3"><span class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center"><i class="fa-solid fa-headset"></i></span><div><b>Tư vấn viên AURA</b><div class="text-xs text-white/70"><i class="fa-solid fa-circle text-emerald-300 text-[8px] mr-1"></i>Trực tuyến 24/7 • Hotline 1900 8888</div></div></div>
 <div id="msgs" class="h-80 overflow-y-auto p-4 space-y-3 bg-slate-50">${m.map(x=>`<div class="flex ${x.me?'justify-end':''}"><span class="max-w-[75%] px-4 py-2.5 rounded-2xl text-sm ${x.me?'bg-purple-600 text-white rounded-br-sm':'bg-white shadow-sm rounded-bl-sm'}">${esc(x.t)}</span></div>`).join('')}</div>
 <div class="flex gap-2 p-3 border-t overflow-x-auto">${['Phí vận chuyển?','Đổi trả thế nào?','Cửa hàng ở đâu?'].map(q=>`<button onclick="send('${q}')" class="px-3 py-1.5 rounded-full bg-purple-50 text-purple-700 text-xs whitespace-nowrap hover:bg-purple-100">${q}</button>`).join('')}</div>
 <div class="flex gap-2 p-3 pt-0"><input id="ci" onkeydown="if(event.key==='Enter')send()" placeholder="Nhập tin nhắn..." class="inp"><button onclick="send()" class="px-5 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white"><i class="fa-solid fa-paper-plane"></i></button></div></div>`}};
const empty=(i,t,s='')=>`<div class="bg-white rounded-3xl p-12 text-center text-slate-400 shadow-sm"><i class="fa-solid ${i} text-5xl text-purple-200"></i><div class="mt-3 font-semibold text-slate-500">${t}</div><div class="text-sm">${s}</div><a href="index.html#products" class="inline-block mt-4 px-5 py-2 rounded-full bg-slate-900 text-white text-sm">Đến cửa hàng</a></div>`;
function render(){shell();view.innerHTML=views[cur]();const m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight}
function saveP(){['name','email','phone','dob','gender'].forEach(k=>C.p[k]=document.getElementById('f_'+k).value);S('aura_cus_v1',C);ME.name=C.p.name;S('aura_user',ME);render();toast('Đã lưu hồ sơ ✔')}
function pickAv(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,256/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);C.p.avatar=c.toDataURL('image/jpeg',.85);S('aura_cus_v1',C);render()};im.src=r.result};r.readAsDataURL(f)}
function cancel(code){if(!confirm('Hủy đơn '+code+'?'))return;const o=L('aura_orders',[]);o.find(x=>x.code===code).status='Đã hủy';S('aura_orders',o);render();toast('Đã hủy đơn')}
function unfav(id){S('aura_fav',L('aura_fav',[]).filter(x=>x.id!==id));render();toast('Đã bỏ yêu thích')}
function addrForm(id){const a=id?C.addr.find(x=>x.id===id):{};mbox.innerHTML=`<h2 class="text-xl font-bold mb-4">${id?'Sửa':'Thêm'} địa chỉ</h2><div class="space-y-3">${[['name','Người nhận'],['phone','Số điện thoại'],['line','Địa chỉ chi tiết']].map(f=>`<input id="a_${f[0]}" value="${esc(a[f[0]])}" placeholder="${f[1]}" class="inp">`).join('')}</div><div class="flex gap-3 mt-5"><button onclick="modal.classList.add('hidden')" class="flex-1 py-3 rounded-xl border font-semibold">Hủy</button><button onclick="saveA(${id||0})" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold">Lưu</button></div>`;modal.classList.remove('hidden')}
function saveA(id){const o={};['name','phone','line'].forEach(k=>o[k]=document.getElementById('a_'+k).value.trim());if(!o.name||!o.line){toast('Nhập đủ tên và địa chỉ');return}if(id)Object.assign(C.addr.find(x=>x.id===id),o);else C.addr.push({id:Date.now(),def:C.addr.length?0:1,...o});S('aura_cus_v1',C);modal.classList.add('hidden');render();toast('Đã lưu địa chỉ ✔')}
function defA(id){C.addr.forEach(a=>a.def=+(a.id===id));S('aura_cus_v1',C);render()}
function delA(id){if(!confirm('Xóa địa chỉ này?'))return;C.addr=C.addr.filter(a=>a.id!==id);S('aura_cus_v1',C);render()}
const BOT=[[/ship|vận chuyển|giao/i,'AURA miễn phí vận chuyển cho đơn từ 1.000.000đ, giao nội thành trong 24 giờ ạ.'],[/đổi|trả/i,'Bạn được đổi trả miễn phí trong 30 ngày với sản phẩm còn nguyên tem mác nhé.'],[/cửa hàng|địa chỉ|ở đâu/i,'AURA có cửa hàng tại Bến Thành, Landmark 81 và Phú Mỹ Hưng. Xem bản đồ ở mục Cửa hàng nhé!'],[/voucher|mã|giảm/i,'Bạn dùng mã AURA2026 để giảm 200.000đ cho đơn đầu tiên nhé!']];
function send(t){const i=document.getElementById('ci');t=t||i.value.trim();if(!t)return;const m=L('aura_chat',[{me:0,t:'Xin chào! AURA có thể giúp gì cho bạn? 😊'}]);m.push({me:1,t});S('aura_chat',m);render();
 setTimeout(()=>{const r=(BOT.find(b=>b[0].test(t))||[0,'Cảm ơn bạn! Nhân viên sẽ phản hồi sớm, hoặc gọi hotline 1900 8888 để được hỗ trợ ngay.'])[1];const m2=L('aura_chat',[]);m2.push({me:0,t:r});S('aura_chat',m2);if(cur==='chat')render()},900)}
function route(){const k=(location.hash||'#profile').slice(1);cur=views[k]?k:'profile';render();scrollTo(0,0)}
addEventListener('hashchange',route);modal.onclick=e=>{if(e.target===modal)modal.classList.add('hidden')};route();
</script></body></html>
