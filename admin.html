function pick(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,400/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.8);imgurl.value=d;pv.src=d;pv.style.opacity=1};im.src=rd.result};rd.readAsDataURL(f)}
function saveF(id){const m=M[cur],o={};let bad=0;mbox.querySelectorAll('[data-k]').forEach(e=>o[e.dataset.k]=e.value);
 m.f.forEach(f=>{if(f.t==='number'||f.t==='money')o[f.k]=+o[f.k]||0});
 const k0=m.f.find(f=>f.t==='text'||f.t==='date');if(!String(o[k0.k]||'').trim()){toast('Vui lòng nhập '+k0.l);return}
 if(id){Object.assign(DB[cur].find(x=>x.id===id),o)}else{DB[cur].push({id:Math.max(0,...DB[cur].map(x=>x.id))+1,...o})}
 save();closeM();render();toast(id?'Đã cập nhật ✔':'Đã thêm mới ✔')}
function del(id){if(!confirm('Bạn chắc chắn muốn xóa mục này?'))return;DB[cur]=DB[cur].filter(x=>x.id!==id);save();render();toast('Đã xóa')}
function renderCfg(){const c=DB.cai;view.innerHTML=`<h1 class="text-2xl font-bold up"><i class="fa-solid fa-gear text-purple-500 mr-2"></i>Cài đặt</h1>
 <div class="grid lg:grid-cols-2 gap-5 mt-5"><div class="bg-white rounded-3xl p-6 shadow-sm up space-y-3"><b>Thông tin cửa hàng</b>${[['name','Tên cửa hàng'],['hotline','Hotline'],['email','Email'],['address','Địa chỉ'],['freeship','Miễn phí ship từ (đ)']].map(([k,l])=>`<label class="block"><span class="text-sm text-slate-500">${l}</span><input id="c_${k}" value="${esc(c[k])}" class="inp mt-1"></label>`).join('')}<button onclick="['name','hotline','email','address','freeship'].forEach(k=>DB.cai[k]=document.getElementById('c_'+k).value);save();toast('Đã lưu cài đặt ✔')" class="px-6 py-3 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold"><i class="fa-solid fa-floppy-disk mr-1"></i>Lưu</button></div>
 <div class="bg-white rounded-3xl p-6 shadow-sm up space-y-3"><b>Dữ liệu</b><p class="text-sm text-slate-500">Toàn bộ dữ liệu được lưu trong trình duyệt này.</p>
 <button onclick="const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}));a.download='aura-data.json';a.click()" class="w-full py-3 rounded-xl border hover:bg-sky-50 text-sky-700 font-semibold"><i class="fa-solid fa-download mr-2"></i>Xuất dữ liệu (JSON)</button>
 <button onclick="if(confirm('Khôi phục toàn bộ dữ liệu mẫu?')){localStorage.removeItem(KEY);load();render();toast('Đã khôi phục dữ liệu mẫu')}" class="w-full py-3 rounded-xl border hover:bg-red-50 text-red-600 font-semibold"><i class="fa-solid fa-rotate-left mr-2"></i>Khôi phục dữ liệu mẫu</button></div></div>`}
