<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thanh toán - AURA</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{font-family:Inter,sans-serif}.serif{font-family:'Playfair Display',serif}
@keyframes up{from{opacity:0;transform:translateY(14px)}}.up{animation:up .5s both}
.inp{width:100%;padding:.7rem .9rem;border:1px solid #e2e8f0;border-radius:.75rem;outline:none;background:#fff}.inp:focus{border-color:#a855f7;box-shadow:0 0 0 3px #f3e8ff}
.opt{cursor:pointer;border:2px solid #e2e8f0;border-radius:1rem;padding:.8rem 1rem;display:flex;gap:.7rem;align-items:center;transition:.2s;background:#fff}.opt:hover{border-color:#c4b5fd}.opt:has(input:checked){border-color:#9333ea;background:#faf5ff}
@media print{.noprint{display:none!important}body{background:#fff!important}#inv{box-shadow:none!important}}</style></head>
<body class="bg-gradient-to-br from-rose-50 via-violet-50 to-sky-50 min-h-screen">
<header class="noprint bg-white/80 backdrop-blur sticky top-0 z-30 border-b"><div class="max-w-6xl mx-auto px-4 h-16 flex items-center gap-3">
<a href="index.html" class="serif text-2xl font-bold flex items-center gap-2"><span class="w-9 h-9 rounded-full bg-gradient-to-tr from-slate-900 to-purple-800 text-amber-400 flex items-center justify-center">A</span>AURA<span class="text-amber-500">.</span></a><span class="flex-1"></span>
<div class="hidden sm:flex items-center gap-2 text-xs font-semibold text-slate-400" id="steps"></div></div></header>
<main class="max-w-6xl mx-auto px-4 py-6" id="app"></main>
<script>
let ME=null;try{ME=JSON.parse(localStorage.getItem('aura_user'))}catch(e){}
if(!ME)location.href='login.html';
const L=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const money=n=>Number(n||0).toLocaleString('vi-VN')+'đ',esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let items=L('aura_checkout',[]).map(x=>({...x,quantity:x.quantity||1})),vc='',ship='std',pay='cod',xp={},rate={};
const SEEDR=[['Ngọc Anh',5,'Chất lượng rất tốt, đúng như hình, giao nhanh!'],['Minh Tuấn',5,'Đóng gói cẩn thận, mặc rất vừa vặn.'],['Thu Hà',4,'Đẹp, hơi khác màu một chút nhưng vẫn ưng ý.'],['Mai Lan',5,'Sẽ ủng hộ shop dài dài!']];
const revs=id=>[...SEEDR.slice(id%2,id%2+2),...(L('aura_reviews',{})[id]||[])];
const stars=n=>`<span class="text-amber-400">${'★'.repeat(Math.round(n))}<span class="text-slate-200">${'★'.repeat(5-Math.round(n))}</span></span>`;
const sub=()=>items.reduce((a,i)=>a+i.price*i.quantity,0);
function calc(){const s=sub();let d=0,f=ship==='fast'?50000:(s>=1e6?0:30000);
 if(vc==='AURA2026'&&s>=1e6)d=200000;if(vc==='SALE15')d=Math.round(s*.15);if(vc==='FREESHIP')f=0;if(!items.length)f=0;return{s,d,f,t:s-d+f}}
function steps(n){document.getElementById('steps').innerHTML=['Giỏ hàng','Thanh toán','Hóa đơn'].map((t,i)=>`<span class="flex items-center gap-1 ${i<=n?'text-purple-600':''}"><span class="w-6 h-6 rounded-full flex items-center justify-center ${i<=n?'bg-purple-600 text-white':'bg-slate-200'}">${i+1}</span>${t}</span>`).join('<i class="fa-solid fa-chevron-right text-[9px]"></i>')}
function page(){steps(1);const A=app;
 if(!items.length){A.innerHTML=`<div class="bg-white rounded-3xl p-14 text-center shadow-sm"><i class="fa-solid fa-cart-shopping text-6xl text-purple-200"></i><h2 class="text-xl font-bold mt-4">Chưa có sản phẩm để thanh toán</h2><a href="index.html#products" class="inline-block mt-5 px-6 py-3 rounded-full bg-slate-900 text-white font-semibold">Đến cửa hàng</a> <a href="sale.html" class="inline-block mt-5 px-6 py-3 rounded-full bg-amber-400 font-semibold">Xem khuyến mãi</a></div>`;return}
 const c=(L('aura_cus_v1',{}).addr||[]).find(a=>a.def)||{};
 A.innerHTML=`<h1 class="text-2xl font-bold mb-5 up"><i class="fa-solid fa-credit-card text-purple-500 mr-2"></i>Thanh toán đơn hàng</h1><div class="grid lg:grid-cols-3 gap-6"><div class="lg:col-span-2 space-y-5"><div id="items" class="space-y-4"></div>
 <div class="bg-white rounded-3xl shadow-sm p-6 up"><b class="block mb-3"><i class="fa-solid fa-location-dot text-purple-500 mr-2"></i>Thông tin giao hàng</b><div class="grid sm:grid-cols-2 gap-3"><input id="n" class="inp" placeholder="Họ tên người nhận" value="${esc(c.name||ME.name)}"><input id="p" class="inp" placeholder="Số điện thoại" value="${esc(c.phone||'')}"><input id="a" class="inp sm:col-span-2" placeholder="Địa chỉ nhận hàng" value="${esc(c.line||'')}"><input id="nt" class="inp sm:col-span-2" placeholder="Ghi chú (không bắt buộc)"></div></div>
 <div class="bg-white rounded-3xl shadow-sm p-6 up"><b class="block mb-3"><i class="fa-solid fa-truck-fast text-purple-500 mr-2"></i>Vận chuyển</b><div class="grid sm:grid-cols-2 gap-3">${[['std','fa-truck','Tiêu chuẩn (2-3 ngày)','Miễn phí từ 1.000.000đ, còn lại 30.000đ'],['fast','fa-bolt','Hỏa tốc (24 giờ)','50.000đ']].map(o=>`<label class="opt"><input type="radio" name="sh" value="${o[0]}" ${ship===o[0]?'checked':''} onchange="ship=this.value;sum()"><i class="fa-solid ${o[1]} text-xl text-purple-500"></i><span><b class="text-sm">${o[2]}</b><br><span class="text-xs text-slate-400">${o[3]}</span></span></label>`).join('')}</div></div>
 <div class="bg-white rounded-3xl shadow-sm p-6 up"><b class="block mb-3"><i class="fa-solid fa-wallet text-purple-500 mr-2"></i>Phương thức thanh toán</b><div class="grid sm:grid-cols-2 gap-3">${[['cod','fa-money-bill-wave','Thanh toán khi nhận hàng (COD)'],['bank','fa-building-columns','Chuyển khoản ngân hàng'],['card','fa-credit-card','Thẻ Visa / Mastercard'],['momo','fa-mobile-screen','Ví MoMo / ZaloPay']].map(o=>`<label class="opt"><input type="radio" name="pm" value="${o[0]}" ${pay===o[0]?'checked':''} onchange="pay=this.value"><i class="fa-solid ${o[1]} text-xl text-purple-500"></i><b class="text-sm">${o[2]}</b></label>`).join('')}</div></div></div>
 <aside><div class="bg-white rounded-3xl shadow-sm p-6 lg:sticky lg:top-24 up"><b class="text-lg">Tóm tắt đơn hàng</b><div class="flex gap-2 mt-4"><input id="vc" class="inp" placeholder="Mã giảm giá" value="${vc}"><button onclick="applyV()" class="px-4 rounded-xl bg-slate-900 text-white font-semibold hover:bg-purple-700">Áp dụng</button></div><div class="text-[11px] text-slate-400 mt-1">Thử: AURA2026 • SALE15 • FREESHIP</div><div id="sum" class="mt-4 space-y-2 text-sm"></div><button onclick="placeOrder()" class="w-full mt-5 py-4 rounded-2xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold text-lg hover:shadow-xl transition"><i class="fa-solid fa-lock mr-2"></i>Đặt hàng</button><p class="text-[11px] text-slate-400 text-center mt-3"><i class="fa-solid fa-shield-halved mr-1"></i>Thông tin được bảo mật • Đổi trả 30 ngày</p></div></aside></div>`;
 rItems();sum()}
function rItems(){document.getElementById('items').innerHTML=items.map((it,i)=>{const rv=revs(it.id),avg=rv.reduce((a,x)=>a+x[1],0)/rv.length;return `<div class="bg-white rounded-3xl shadow-sm p-5 up hover:shadow-lg transition"><div class="flex gap-4"><img src="${esc(it.image)}" class="w-24 h-28 rounded-2xl object-cover bg-slate-100" onerror="this.style.opacity=.2"><div class="flex-1 min-w-0"><span class="text-[11px] font-bold text-slate-400 uppercase">${esc(it.categoryName||it.cat||'')}</span><div class="font-semibold">${esc(it.name)}</div><div class="text-xs mt-0.5">${stars(avg)} <span class="text-slate-400">(${rv.length} đánh giá)</span></div>
 <div class="mt-2"><b class="text-purple-700">${money(it.price)}</b>${it.oldPrice?` <s class="text-xs text-slate-400">${money(it.oldPrice)}</s>`:''}</div>
 <div class="flex items-center gap-3 mt-3"><div class="flex items-center border rounded-xl overflow-hidden"><button onclick="qty(${i},-1)" class="w-9 h-9 hover:bg-purple-50"><i class="fa-solid fa-minus text-xs"></i></button><b class="w-9 text-center">${it.quantity}</b><button onclick="qty(${i},1)" class="w-9 h-9 hover:bg-purple-50"><i class="fa-solid fa-plus text-xs"></i></button></div><b class="ml-auto text-lg">${money(it.price*it.quantity)}</b><button onclick="rm(${i})" class="w-9 h-9 rounded-lg text-red-400 hover:bg-red-50"><i class="fa-solid fa-trash"></i></button></div></div></div>
 <button onclick="xp[${it.id}]=!xp[${it.id}];rItems()" class="mt-3 text-sm font-semibold text-purple-600"><i class="fa-regular fa-comments mr-1"></i>${xp[it.id]?'Ẩn':'Xem'} đánh giá & chi tiết <i class="fa-solid fa-chevron-${xp[it.id]?'up':'down'} text-[10px]"></i></button>
 ${xp[it.id]?`<div class="mt-3 bg-slate-50 rounded-2xl p-4 space-y-3 text-sm"><div class="grid grid-cols-3 gap-2 text-center text-[11px] text-slate-500"><span><i class="fa-solid fa-shield-halved text-purple-500 block text-lg"></i>Chính hãng 100%</span><span><i class="fa-solid fa-truck-fast text-amber-500 block text-lg"></i>Giao 24 giờ</span><span><i class="fa-solid fa-rotate-left text-blue-500 block text-lg"></i>Đổi trả 30 ngày</span></div>${rv.map(r=>`<div class="border-t pt-2"><b>${esc(r[0])}</b> ${stars(r[1])}<div class="text-slate-500">${esc(r[2])}</div></div>`).join('')}
 <div class="border-t pt-3"><b>Viết đánh giá của bạn</b><div class="text-xl text-slate-300 my-1">${[1,2,3,4,5].map(n=>`<button onclick="rate[${it.id}]=${n};rItems()" class="${n<=(rate[it.id]||5)?'text-amber-400':''}">★</button>`).join('')}</div><div class="flex gap-2"><input id="rv${it.id}" class="inp" placeholder="Chia sẻ cảm nhận..."><button onclick="addRv(${it.id})" class="px-4 rounded-xl bg-purple-600 text-white font-semibold">Gửi</button></div></div></div>`:''}</div>`}).join('')}
function sum(){const t=calc();document.getElementById('sum').innerHTML=`<div class="flex justify-between"><span class="text-slate-500">Tạm tính (${items.reduce((a,i)=>a+i.quantity,0)} sp)</span><b>${money(t.s)}</b></div><div class="flex justify-between"><span class="text-slate-500">Phí vận chuyển</span><b>${t.f?money(t.f):'Miễn phí'}</b></div><div class="flex justify-between text-emerald-600"><span>Giảm giá ${vc?'('+vc+')':''}</span><b>-${money(t.d)}</b></div><div class="flex justify-between items-end border-t pt-3 mt-2"><span class="font-semibold">Tổng cộng</span><b class="text-2xl text-purple-700">${money(t.t)}</b></div>`}
function save(){S('aura_checkout',items)}
function qty(i,d){items[i].quantity=Math.max(1,items[i].quantity+d);save();rItems();sum()}
function rm(i){items.splice(i,1);save();page()}
function applyV(){const v=document.getElementById('vc').value.trim().toUpperCase();if(!['AURA2026','SALE15','FREESHIP',''].includes(v)){alert('Mã không hợp lệ');return}if(v==='AURA2026'&&sub()<1e6){alert('Mã AURA2026 áp dụng cho đơn từ 1.000.000đ');return}vc=v;sum()}
function addRv(id){const el=document.getElementById('rv'+id),t=el.value.trim();if(!t)return;const a=L('aura_reviews',{});(a[id]=a[id]||[]).push([ME.name,rate[id]||5,t]);S('aura_reviews',a);rItems()}
function placeOrder(){const n=g('n'),p=g('p'),a=g('a');if(!n||!p||!a){alert('Vui lòng nhập đủ họ tên, số điện thoại và địa chỉ!');return}
 const t=calc(),o={code:'#'+(3000+Math.floor(Math.random()*6999)),date:new Date().toISOString().slice(0,10),status:'Chờ xác nhận',total:t.t,sub:t.s,discount:t.d,shipFee:t.f,voucher:vc,pay,customer:n,phone:p,address:a,items:items.map(i=>({name:i.name,price:i.price,quantity:i.quantity,image:i.image}))};
 const all=L('aura_orders',[]);all.unshift(o);S('aura_orders',all);const C=L('aura_cus_v1',null);if(C){C.p.points+=Math.floor(t.t/10000);S('aura_cus_v1',C)}
 localStorage.removeItem('aura_checkout');invoice(o)}
const g=id=>document.getElementById(id).value.trim();
const PAYN={cod:'Thanh toán khi nhận hàng (COD)',bank:'Chuyển khoản ngân hàng',card:'Thẻ Visa / Mastercard',momo:'Ví MoMo / ZaloPay'};
function invoice(o){steps(2);app.innerHTML=`<div class="noprint text-center mb-5 up"><span class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 text-3xl inline-flex items-center justify-center"><i class="fa-solid fa-check"></i></span><h1 class="text-2xl font-bold mt-3">Đặt hàng thành công! 🎉</h1><p class="text-slate-500">Cảm ơn bạn đã mua sắm tại AURA. Hóa đơn của bạn ở bên dưới.</p></div>
 <div id="inv" class="bg-white max-w-3xl mx-auto rounded-3xl shadow-xl p-8 md:p-10 relative overflow-hidden up"><div class="absolute -right-6 top-20 rotate-12 border-4 border-emerald-500/60 text-emerald-500/60 font-extrabold text-2xl px-4 py-1 rounded-xl">ĐÃ ĐẶT HÀNG</div>
 <div class="flex items-start border-b-2 border-dashed pb-5"><div><div class="serif text-3xl font-bold">AURA<span class="text-amber-500">.</span></div><div class="text-xs text-slate-500 mt-1">Thời Trang & Phong Cách Sống Cao Cấp<br>Quận 1, TP.HCM • Hotline 1900 8888 • hello@aura.vn</div></div><div class="ml-auto text-right"><div class="text-xl font-bold text-purple-700">HÓA ĐƠN BÁN HÀNG</div><div class="text-sm text-slate-500">Số: <b>${esc(o.code)}</b><br>Ngày: ${o.date.split('-').reverse().join('/')}</div></div></div>
 <div class="grid sm:grid-cols-2 gap-4 py-5 text-sm"><div><b class="text-slate-400 text-xs uppercase">Khách hàng</b><div class="font-semibold">${esc(o.customer)}</div><div>${esc(o.phone)}</div><div class="text-slate-500">${esc(o.address)}</div></div><div><b class="text-slate-400 text-xs uppercase">Thanh toán</b><div class="font-semibold">${PAYN[o.pay]}</div><div class="text-slate-500">Trạng thái: ${o.status}</div></div></div>
 <table class="w-full text-sm"><thead><tr class="bg-slate-50 text-slate-500 text-left"><th class="p-3">#</th><th class="p-3">Sản phẩm</th><th class="p-3 text-center">SL</th><th class="p-3 text-right">Đơn giá</th><th class="p-3 text-right">Thành tiền</th></tr></thead><tbody>${o.items.map((i,k)=>`<tr class="border-b"><td class="p-3">${k+1}</td><td class="p-3 font-medium">${esc(i.name)}</td><td class="p-3 text-center">${i.quantity}</td><td class="p-3 text-right">${money(i.price)}</td><td class="p-3 text-right font-semibold">${money(i.price*i.quantity)}</td></tr>`).join('')}</tbody></table>
 <div class="ml-auto max-w-xs mt-5 space-y-1.5 text-sm"><div class="flex justify-between"><span class="text-slate-500">Tạm tính</span>${money(o.sub)}</div><div class="flex justify-between"><span class="text-slate-500">Phí vận chuyển</span>${o.shipFee?money(o.shipFee):'Miễn phí'}</div><div class="flex justify-between text-emerald-600"><span>Giảm giá ${o.voucher?'('+o.voucher+')':''}</span>-${money(o.discount)}</div><div class="flex justify-between border-t-2 pt-2 text-lg"><b>TỔNG CỘNG</b><b class="text-purple-700">${money(o.total)}</b></div></div>
 <div class="text-center text-xs text-slate-400 mt-8 border-t pt-4">Cảm ơn quý khách! Đổi trả miễn phí trong 30 ngày với sản phẩm còn nguyên tem mác.<div class="mt-2 tracking-[6px] text-slate-300 text-2xl">||| || ||| | |||| ||</div></div></div>
 <div class="noprint flex flex-wrap justify-center gap-3 mt-6"><button onclick="print()" class="px-6 py-3 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold"><i class="fa-solid fa-print mr-2"></i>In / Lưu PDF hóa đơn</button><a href="customer.html#orders" class="px-6 py-3 rounded-xl bg-white border font-semibold hover:bg-purple-50"><i class="fa-solid fa-receipt mr-2"></i>Xem đơn hàng</a><a href="index.html" class="px-6 py-3 rounded-xl bg-slate-900 text-white font-semibold"><i class="fa-solid fa-house mr-2"></i>Về trang chủ</a></div>`;scrollTo(0,0)}
page();
</script></body></html>
